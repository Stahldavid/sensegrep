name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version == 20 && 24 || matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Build
        run: npm run build

      - name: Typecheck
        if: matrix.node-version != 20
        run: npm run check:types

      - name: Version Consistency
        if: matrix.node-version != 20
        run: npm run version:check

      - name: Test
        if: matrix.node-version != 20
        run: npm run test:unit

      - name: Evaluator and build-tool tests
        if: matrix.node-version != 20
        run: npm run test:node

      - name: Verify packaged artifacts
        if: matrix.node-version != 20
        run: npm run release:verify

      - name: README local links
        if: matrix.node-version != 20
        run: npm run check:docs

      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        with:
          python-version: '3.12'

      - name: Research Python tests
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        run: npm run test:python

      - name: Use Node.js 20 for published runtime compatibility
        if: matrix.node-version == 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Published runtime compatibility smoke
        if: matrix.node-version == 20
        run: node scripts/runtime-smoke.mjs
